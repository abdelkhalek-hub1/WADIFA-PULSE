name: "Moteur Autonome de Veille et d'Alerte Concours Maroc"

on:
  schedule:
    # Exécution automatique chaque jour à 08:00 UTC (09:00 heure marocaine)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  veille-et-alertes:
    name: "Veille quotidienne et diffusion des alertes"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Cloner le dépôt de code"
        uses: actions/checkout@v4

      - name: "Configurer l'environnement Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Installer les dépendances logicielles"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Exécuter le pipeline de veille et diffuser les notifications"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_ENABLED: "true"
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TELEGRAM_ENABLED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED || 'false' }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          GOOGLE_SHEETS_ENABLED: "true"
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python main.py


