<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — WadifaBot Maroc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/90 shadow-xl shadow-slate-200/50">
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-3xl shadow-lg shadow-emerald-200 mx-auto mb-4">
                <i class="ph-bold ph-shield-check"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">WadifaBot Maroc</h2>
            <p class="text-sm text-slate-500 mt-1">Espace sécurisé de veille des concours publics</p>
        </div>

        {% if error %}
        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center space-x-2">
            <i class="ph-bold ph-warning-circle text-lg flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form class="mt-8 space-y-5" action="/login" method="POST">
            <div>
                <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Adresse Email</label>
                <div class="relative">
                    <i class="ph-bold ph-envelope absolute left-3.5 top-3 text-slate-400 text-base"></i>
                    <input id="email" name="email" type="email" required autocomplete="email" placeholder="votre.email@gmail.com" class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition bg-slate-50/50">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mot de passe</label>
                <div class="relative">
                    <i class="ph-bold ph-lock-key absolute left-3.5 top-3 text-slate-400 text-base"></i>
                    <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••••••" class="w-full pl-10 pr-10 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition bg-slate-50/50">
                    <button type="button" onclick="togglePass()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-lg">
                        <i id="eyeIcon" class="ph-bold ph-eye"></i>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 transition shadow-lg shadow-emerald-200 flex items-center justify-center space-x-2">
                    <span>Accéder au Tableau de Bord</span>
                    <i class="ph-bold ph-arrow-right"></i>
                </button>
            </div>
        </form>

        <div class="text-center pt-4 border-t border-slate-100">
            <p class="text-xs text-slate-400">Authentification sécurisée via Supabase PostgreSQL</p>
        </div>
    </div>

    <script>
        function togglePass() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'ph-bold ph-eye-slash';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'ph-bold ph-eye';
            }
        }
    </script>
</body>
</html>
