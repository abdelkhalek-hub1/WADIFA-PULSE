<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Sécurisée — WadifaBot Maroc</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        .bg-mesh {
            background-color: #090d16;
            background-image: 
                radial-gradient(at 10% 20%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-ambient { animation: pulse-slow 8s infinite ease-in-out; }
    </style>
</head>
<body class="h-full bg-mesh text-slate-100 flex items-center justify-center p-4 sm:p-6 relative overflow-hidden select-none">

    <!-- Ambient Glow Circles -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none animate-ambient"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none animate-ambient" style="animation-delay: 4s;"></div>

    <div class="max-w-md w-full relative z-10">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 p-0.5 shadow-xl shadow-emerald-500/20 mb-4">
                <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
                    <i class="ph-fill ph-briefcase text-3xl text-emerald-400"></i>
                </div>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">WadifaBot Maroc</h1>
            <p class="text-sm text-slate-400 mt-1.5">Veille autonome des concours &middot; Spécialité Web Full Stack</p>
        </div>

        <!-- Glassmorphism Card -->
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-7 sm:p-9 shadow-2xl shadow-black/60">
            
            {% if error %}
            <div class="mb-6 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm flex items-start space-x-3 animate-fade-in">
                <i class="ph-bold ph-warning-circle text-lg flex-shrink-0 text-rose-400 mt-0.5"></i>
                <div class="flex-1 font-medium leading-relaxed">{{ error }}</div>
            </div>
            {% endif %}

            <form class="space-y-5" action="/login" method="POST" id="loginForm" onsubmit="handleSubmit(event)">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                        Adresse Email
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-emerald-400 transition-colors">
                            <i class="ph-bold ph-envelope text-lg"></i>
                        </div>
                        <input id="email" name="email" type="email" required autofocus autocomplete="email" 
                            placeholder="abdelkhalekouaraqy@gmail.com" 
                            class="w-full pl-11 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-200">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                            Mot de passe
                        </label>
                        <span class="text-[11px] text-slate-500">Sécurisé Supabase</span>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-emerald-400 transition-colors">
                            <i class="ph-bold ph-lock-key text-lg"></i>
                        </div>
                        <input id="password" name="password" type="password" required autocomplete="current-password" 
                            placeholder="••••••••••••" 
                            class="w-full pl-11 pr-11 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-200">
                        <button type="button" onclick="togglePass()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors">
                            <i id="eyeIcon" class="ph-bold ph-eye text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" id="btnSubmit" 
                        class="w-full py-3.5 px-4 rounded-xl text-sm font-bold text-slate-950 bg-gradient-to-r from-emerald-400 to-teal-400 hover:from-emerald-300 hover:to-teal-300 active:scale-[0.98] transition-all duration-150 shadow-lg shadow-emerald-500/25 flex items-center justify-center space-x-2">
                        <span id="btnText">Accéder au Tableau de Bord</span>
                        <i id="btnIcon" class="ph-bold ph-arrow-right text-base"></i>
                        <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-500">
                <span class="flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>PostgreSQL 17 Actif</span>
                </span>
                <span>Version 2.0 Full Stack</span>
            </div>
        </div>

        <p class="text-center text-xs text-slate-600 mt-6">
            Système privé réservé &middot; emploi-public.ma + wadifa-info.com
        </p>
    </div>

    <script>
        function togglePass() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'ph-bold ph-eye-slash text-lg';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'ph-bold ph-eye text-lg';
            }
        }

        function handleSubmit(e) {
            const btn = document.getElementById('btnSubmit');
            const text = document.getElementById('btnText');
            const icon = document.getElementById('btnIcon');
            const spinner = document.getElementById('btnSpinner');

            btn.disabled = true;
            btn.classList.add('opacity-90', 'cursor-not-allowed');
            text.innerText = 'Connexion en cours...';
            icon.classList.add('hidden');
            spinner.classList.remove('hidden');
        }
    </script>
</body>
</html>
